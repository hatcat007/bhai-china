<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Logo 04: Steering Wheel — Buster at the wheel -->
  <rect width="400" height="120" fill="#000000"/>
  <g transform="translate(40 60)">
    <!-- Outer wheel -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="6" fill="#E56910"/>
    <!-- Spokes -->
    <line x1="0" y1="-22" x2="0" y2="-6" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="6" x2="0" y2="22" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="-22" y1="0" x2="-6" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="6" y1="0" x2="22" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Diagonal spokes -->
    <line x1="-15.5" y1="-15.5" x2="-4.2" y2="-4.2" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="15.5" y1="-15.5" x2="4.2" y2="-4.2" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="-15.5" y1="15.5" x2="-4.2" y2="4.2" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="15.5" y1="15.5" x2="4.2" y2="4.2" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <text x="80" y="65" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">BETTER HUMAN<tspan fill="#E56910"> AI</tspan></text>
  <text x="80" y="83" font-family="ui-monospace, monospace" font-size="9" fill="#6B7280" letter-spacing="2">BUSTER VED RORET · DREVET AF AI</text>
</svg>
