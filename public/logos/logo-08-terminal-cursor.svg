<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Logo 08: Terminal Cursor — code/mono aesthetic -->
  <rect width="400" height="120" fill="#000000"/>
  <!-- Terminal prompt -->
  <text x="20" y="60" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#E56910">$</text>
  <text x="42" y="60" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="16" fill="#FFFFFF">bhai</text>
  <!-- Blinking cursor -->
  <rect x="92" y="44" width="10" height="18" fill="#E56910">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="20" y="85" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">BETTER HUMAN<tspan fill="#E56910"> AI</tspan></text>
  <text x="180" y="60" font-family="ui-monospace, monospace" font-size="9" fill="#6B7280" letter-spacing="2">// SHIPPING PRODUCTION · NOT PPT</text>
</svg>
