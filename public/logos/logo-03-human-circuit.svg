<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Logo 03: Human + Circuit — AI augmentation of human -->
  <rect width="400" height="120" fill="#000000"/>
  <!-- Human silhouette -->
  <circle cx="40" cy="50" r="9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 28 70 Q 40 60 52 70 L 52 85 L 28 85 Z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Circuit nodes around -->
  <circle cx="60" cy="40" r="2" fill="#E56910"/>
  <circle cx="65" cy="55" r="2" fill="#E56910"/>
  <circle cx="60" cy="70" r="2" fill="#E56910"/>
  <line x1="52" y1="45" x2="60" y2="40" stroke="#E56910" stroke-width="1"/>
  <line x1="52" y1="55" x2="65" y2="55" stroke="#E56910" stroke-width="1"/>
  <line x1="52" y1="65" x2="60" y2="70" stroke="#E56910" stroke-width="1"/>
  <text x="90" y="65" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">BETTER HUMAN<tspan fill="#E56910"> AI</tspan></text>
  <text x="90" y="83" font-family="ui-monospace, monospace" font-size="9" fill="#6B7280" letter-spacing="2">HUMAN AT THE WHEEL · AI DRIVEN</text>
</svg>
